name: Auto-deploy STAGING on push to staging

# Triggers Coolify deploys on the STAGING box (Ashburn region; real IP in
# gitignored scripts/deploy/.env.deploy as $STAGING_VPS_IP) for both api
# (app 3) and web (app 4) on every push to the `staging` branch.
# Counterpart to .github/workflows/deploy.yml (which runs on master → prod).
#
# STAGING NOW HAS ITS OWN SUPABASE DB (separate from prod, isolated 2026-06-16).
# Schema changes applied to staging do NOT reach prod automatically, and Coolify
# never runs migrations. The `migrate` job below closes that gap: it APPLIES
# pending DB migrations against the staging database and BLOCKS the deploy if a
# migration fails (forward-only, idempotent, tracking-table based —
# packages/database/scripts/migrate-ci.ts). `deploy` runs only after `migrate`
# succeeds (needs: migrate).
#
# DOCS-ONLY pushes (only *.md / docs/ / .claude/ / *.itachi-bak changed) skip
# this workflow entirely via paths-ignore — no migrate, no deploy. A push that
# touches ANY non-doc file (incl. packages/database/migrations/*.sql) runs it.
#
# REQUIRED GITHUB REPO SECRETS (Settings → Secrets and variables → Actions):
#   STAGING_VPS_IP             — real IP of the staging box (from scripts/deploy/.env.deploy)
#   STAGING_COOLIFY_SSH_KEY    — contents of ~/.ssh/clawville_deploy (no passphrase
#                                for CI use; key already has password-less variant)
#   STAGING_DATABASE_URL       — tunnel URL for the SELF-HOSTED staging database
#                                (postgresql://clawville:<pw>@127.0.0.1:15432/clawville;
#                                Supabase retired for staging 2026-09-25). Consumed by
#                                the migrate job as MIGRATION_DATABASE_URL. Secret — never logged.
# Until ALL THREE secrets exist, this workflow will fail and staging deploys must run
# manually via `ssh -i ~/.ssh/clawville_deploy root@$STAGING_VPS_IP 'bash /root/clawville-staging-deploy.sh <tested-full-commit-sha>'`.
#
# EMERGENCY OVERRIDE: the FIRST LINE (subject) of the commit message containing
# the literal phrase "[skip migration]" (case-insensitive) skips the actual
# migration step while still letting the migrate job SUCCEED, so deploy proceeds.
# Matched on the subject line only (not the body) so a PR description that merely
# quotes the token cannot bypass the gate. Use only when a migration must be
# applied out-of-band; logged as a CI warning.
#
# clawville-staging-deploy.sh lives on the STAGING box at /root/ and is the
# authoritative copy of scripts/deploy/clawville-staging-deploy.sh in this repo.
# After editing the repo copy, scp it onto the box:
#   scp -i ~/.ssh/clawville_deploy scripts/deploy/clawville-staging-deploy.sh \
#     root@$STAGING_VPS_IP:/root/ && \
#   ssh -i ~/.ssh/clawville_deploy root@$STAGING_VPS_IP 'chmod +x /root/clawville-staging-deploy.sh'

on:
  push:
    branches:
      - staging
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.claude/**'
      - '**.itachi-bak'

concurrency:
  group: coolify-deploy-staging
  cancel-in-progress: false

# SSH HOST KEY PIN: every ssh below trusts only this key (StrictHostKeyChecking=yes,
# HostKeyAlgorithms=ssh-ed25519, BatchMode=yes), so a fresh runner never accepts whatever
# key answers first. Public value, not a secret.
# Staging box ed25519 key, SHA256:h8Mt4ERDdLMt90DxAoN7wvShKWT3UBoZq3nlDe5g9pI.
# Refresh after a host-key rotation: on the box, over an already-trusted session, run
# `ssh-keygen -lf /etc/ssh/ssh_host_ed25519_key.pub`; compare that fingerprint with an
# independent `ssh-keyscan -t ed25519 <ip> | ssh-keygen -lf -`; then replace the key line
# with the contents of /etc/ssh/ssh_host_ed25519_key.pub (type + key, no comment) and the
# fingerprint above.
env:
  STAGING_SSH_HOST_KEY: ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIKmxy94UKrT/eDoZqGBRqYPyJYSVsmAhMgBscwvg7Fyj

jobs:
  # A local reusable workflow checks this exact caller SHA. No PR path filter,
  # missing branch protection, or [skip migration] can bypass these tests.
  gates:
    uses: ./.github/workflows/gates.yml

  migrate:
    needs: gates
    runs-on: ubuntu-latest
    steps:
      - name: Skip-migration guard (emergency override — subject line only)
        id: guard
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          # Match ONLY the first line (subject), so a token buried in a multi-line
          # commit body / PR description cannot silently bypass the migration gate.
          SUBJECT=$(printf '%s' "$COMMIT_MSG" | head -1)
          if printf '%s' "$SUBJECT" | grep -iqF '[skip migration]'; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "::warning::Commit subject contains '[skip migration]' — DB migration step skipped for this deploy. Apply migrations out-of-band."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.guard.outputs.skip != 'true'
        uses: actions/checkout@v4

      - name: Setup Bun
        if: steps.guard.outputs.skip != 'true'
        uses: oven-sh/setup-bun@v2
        with:
          # Pinned to the version the runner was authored + verified against, so a
          # future Bun release can't silently change migration execution semantics.
          bun-version: 1.3.11

      - name: Install dependencies
        if: steps.guard.outputs.skip != 'true'
        # Plain install (uses the committed bun.lock; NOT --frozen-lockfile, so a
        # lockfile-vs-package.json drift can't add a non-migration brick vector to
        # the gate — the gate must block on migration failures only).
        run: bun install

      # The staging DB is self-hosted on the staging box (container clawville-db,
      # bound to the box's loopback only — never public). The runner reaches it
      # through an SSH tunnel: runner 127.0.0.1:15432 -> box 127.0.0.1:5432.
      - name: Open SSH tunnel to the staging DB
        if: steps.guard.outputs.skip != 'true'
        env:
          SSH_KEY: ${{ secrets.STAGING_COOLIFY_SSH_KEY }}
          VPS_IP: ${{ secrets.STAGING_VPS_IP }}
        run: |
          umask 077
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/db_tunnel
          chmod 600 ~/.ssh/db_tunnel
          printf '%s %s\n' "$VPS_IP" "$STAGING_SSH_HOST_KEY" > ~/.ssh/known_hosts
          ssh -i ~/.ssh/db_tunnel -f -N -o ExitOnForwardFailure=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile=~/.ssh/known_hosts -o HostKeyAlgorithms=ssh-ed25519 -o BatchMode=yes \
            -o ServerAliveInterval=15 -L 127.0.0.1:15432:127.0.0.1:5432 "root@$VPS_IP"
          for _ in $(seq 1 20); do
            if (exec 3<>/dev/tcp/127.0.0.1/15432) 2>/dev/null; then echo "tunnel up"; exit 0; fi
            sleep 1
          done
          echo "::error::SSH tunnel to the staging DB did not open"; exit 1

      - name: Apply pending DB migrations (BLOCKING — gates the deploy)
        if: steps.guard.outputs.skip != 'true'
        env:
          # postgresql://clawville:<pw>@127.0.0.1:15432/clawville (through the tunnel above)
          MIGRATION_DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
        run: bun packages/database/scripts/migrate-ci.ts

  deploy:
    needs: migrate
    runs-on: ubuntu-latest
    steps:
      # Plain OpenSSH with the pinned host key above. appleboy/ssh-action@v1.2.0 cannot pin
      # it: its Go client (x/crypto v0.29.0) negotiates ECDSA/RSA before ed25519, and it ran
      # a drone-ssh binary downloaded at run time without a checksum.
      - name: Trigger Coolify deploys via SSH
        env:
          SSH_KEY: ${{ secrets.STAGING_COOLIFY_SSH_KEY }}
          VPS_IP: ${{ secrets.STAGING_VPS_IP }}
          DEPLOY_SHA: ${{ github.sha }}
        run: |
          umask 077
          # The remote script takes exactly one argument: the full 40-hex commit SHA.
          [[ "$DEPLOY_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::DEPLOY_SHA is not a 40-hex commit SHA"; exit 1; }
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s %s\n' "$VPS_IP" "$STAGING_SSH_HOST_KEY" > ~/.ssh/known_hosts
          timeout 5m ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile=~/.ssh/known_hosts -o HostKeyAlgorithms=ssh-ed25519 \
            -o BatchMode=yes -o ConnectTimeout=30 \
            "root@$VPS_IP" bash -s -- "$DEPLOY_SHA" <<'REMOTE'
          set -eo pipefail
          echo "Triggering STAGING Coolify deploys for commit $1"
          # Refuse a stale host helper that would ignore the SHA argument.
          grep -qF 'CLAWVILLE_PINNED_DEPLOY_V1' /root/clawville-staging-deploy.sh
          /root/clawville-staging-deploy.sh "$1"
          echo "Both staging deploys queued."
          REMOTE
