name: Gates — money/cove/poker invariant suite

# CI-gates Phase 0 — arm the backstop.
#
# The money/cove/poker invariant test suite already EXISTS and is well-written,
# but it NEVER ran in CI — a single config gap left the entire money-regression
# backstop un-armed (a flipped payout constant or a broken conservation leg would
# ship to prod uncaught). This gate runs on every PR so required check names
# exist even for documentation-only changes. Deploy callers also run this suite.
#
# DB-tier note: CI has no `.env.local` (gitignored), so `DATABASE_URL` is unset
# and the `describeIfDb`-gated tests SKIP. What runs is the IN-MEMORY suite — the
# poker tournament + cash conservation/idempotency, the slot/blackjack/baccarat/
# holdem engine logic, side-pot/rake conservation, the provably-fair replay — all
# on FakeDb/FakeLedger. That is the guaranteed-green Phase-0 gate. Phase 0b is now
# implemented as the separate api-route-tests-db job below, with a
# Postgres(+pgvector) service + migrations via migrate-ci.ts, not db:push
# (drizzle-kit introspection is broken in this repo).
#
# Local equivalent: `cd apps/api && bun test`  (with DATABASE_URL UNSET).

on:
  # Required branch-protection checks must be emitted on documentation-only PRs too.
  pull_request: {}
  # Deploy callers always invoke this same-SHA suite.
  workflow_call:
    inputs:
      coupling-base-sha:
        type: string
        required: false
        default: ''
  workflow_dispatch:
    inputs:
      coupling-base-sha:
        description: Full base commit SHA for this complete change (no parent fallback)
        type: string
        required: true

concurrency:
  group: gates-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  coupling-gates:
    name: coupling documentation contracts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout evaluated head and full history
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11
      - name: Test coupling enforcement
        run: bun test scripts/ci/run-coupling-gates.test.ts scripts/ci/run-coupling-gates.independent.test.ts
      - name: Enforce changed-file coupling contracts
        env:
          COUPLING_BASE_SHA: ${{ inputs.coupling-base-sha }}
        run: bun scripts/ci/run-coupling-gates.ts --github

  web-tests:
    name: web Trading Floor tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: Install workspace deps
        run: bun install --frozen-lockfile

      - name: Build the packages the web typecheck resolves
        # apps/web imports @clawville/database through its built dist types
        # (packages/database/dist/index.d.ts) and, transitively, drizzle-orm's
        # `/// <reference types="bun-types" />` is what brings `bun:test` into
        # the web program (tsconfig `types` is restricted to node/react). On a
        # fresh runner the dist does not exist, so every route importing the
        # database package AND every test importing bun:test fails TS2307 —
        # exactly the 2026-09-16 PR #276 red lane. apps/web also imports
        # @clawville/agent-runtime (agent-orchestrator, stores/research). Mirror
        # the api lane: build agent-runtime first; turbo pulls database, shared
        # and agent-templates in dependency order.
        run: bunx turbo run build --filter=@clawville/agent-runtime

      - name: Typecheck web
        run: cd apps/web && bun run typecheck

      - name: Run Trading Floor suites in separate processes
        # DOM globals, React queues, query managers, and mock.module are process-global.
        # Preserve every suite and fail immediately on any error.
        shell: bash
        run: |
          cd apps/web
          while IFS= read -r file; do
            bun test "$file"
          done <<'SUITES'
          src/stores/__tests__/trade-ticker.test.ts
          src/stores/__tests__/world-stream-state.test.ts
          src/hooks/use-trading-floor-normalise.test.ts
          src/hooks/use-trading-floor-hooks.test.tsx
          src/components/game/trading-floor/format.test.ts
          src/components/game/trading-floor/floor-tape-placement.test.ts
          src/components/game/trading-floor/floor-components.test.tsx
          src/components/game/trading-floor/clawpump-templates.test.tsx
          src/components/game/trading-floor/house-traders.test.tsx
          src/components/game/trading-floor/trading-floor-structural.test.ts
          src/app/leaderboard/leaderboard-trader-column.test.tsx
          src/lib/__tests__/api-error-code.test.ts
          src/lib/__tests__/solana-wallet.test.ts
          src/lib/world-presence-controller.test.ts
          src/stores/__tests__/players-local-identity.test.ts
          src/stores/__tests__/salvage-identity.test.ts
          src/lib/three/salvage-hydrator.test.tsx
          src/lib/agent-display-name.test.ts
          src/hooks/world-downlink-policy.test.ts
          src/lib/three/town-guide-prompt.test.ts
          src/hooks/bottom-prompt-offset.test.ts
          src/lib/__tests__/hud-anchors-registry.test.ts
          src/lib/three/__tests__/cove-fps-sampler.test.ts
          src/lib/three/cove-exit-spawn.test.ts
          src/components/three/world-stage/stage-frame-cap.test.ts
          src/lib/three/__tests__/cove-click-routing.test.ts
          src/stores/__tests__/npc-place-player.test.ts
          src/components/game/__tests__/spawn-on-load-route-exit.test.ts
          src/lib/__tests__/hud-short-touch.test.ts
          SUITES

      - name: Run guest Nori chat regression suite in its own process
        # This suite installs a DOM and API spies. Keep global test state local.
        run: cd apps/web && bun test src/components/game/__tests__/chat-panel-guest.test.tsx

      # Founder-reported regressions (2026-09-18) come back when nothing runs the
      # test that pinned them. The shared constants suite pins world data that
      # the web and the server both read (land showroom coverage of every plot,
      # parcel layout, salvage bands, kelp portal). ~1 s, no DB, no build needed.
      - name: Run the shared constants suite
        run: cd packages/shared && bun test

  api-invariant-tests:
    name: api money/cove/poker invariant tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: Install workspace deps
        run: bun install --frozen-lockfile

      - name: Build the packages the money tests need
        # The money tests transitively import npc-simulation.ts → @clawville/
        # agent-runtime, so build agent-runtime; turbo pulls its deps
        # (database, shared, agent-templates) in dependency order. This is the
        # PR #203's wager client/reconciliation tests also import
        # @clawville/wager-program, so CI must build its dist too. This remains
        # explicit rather than '--filter=./packages/*', which drags in apps/web.
        # Requires the same-commit agent-runtime build fixes (declared
        # @clawville/database dep + test-file tsc exclude) — without them a fresh
        # CI build of agent-runtime errors TS2307, masked locally by turbo cache.
        run: bunx turbo run build --filter=@clawville/agent-runtime --filter=@clawville/wager-program

      - name: Typecheck API source
        # Bun bundling does not check TypeScript types or imported type contracts.
        run: cd apps/api && bunx tsc --noEmit

      - name: Run the money/cove/poker invariant suite
        # SCOPED to the service test dirs (poker tournament/cash/sims + the
        # slot/blackjack/baccarat/holdem engines + provable-rng + cove-verify-
        # compat + special-event), which run 546/0 GREEN with no DB.
        #
        # NOT the full `bun test apps/api`: that is RED (~43 fail) due to a
        # PRE-EXISTING cross-file test-isolation bug — the in-memory sim
        # singletons (poker-mtt-sim / cash-table-sim) carry state between test
        # files, so the SAME money tests that pass in isolation fail when the
        # whole suite shares one process. Scoping to these dirs sidesteps the
        # pollution and keeps the gate guaranteed-green-on-good-code (a real
        # money regression here still bursts it RED). [Test-isolation cleanup +
        # the DB-backed route tests via a Postgres service are Phase 0b.]
        #
        # DATABASE_URL intentionally UNSET → describeIfDb tests skip; the
        # in-memory conservation/idempotency/parity/no-leak suite IS the gate.
        shell: bash
        run: |
          cd apps/api
          mapfile -d '' files < <(find src/services/poker src/services/__tests__ -name '*.test.ts' -print0 | sort -z)
          test "${#files[@]}" -gt 0
          shared=()
          isolated=()
          for file in "${files[@]}"; do
            if grep -qE 'mock[.]module' "$file"; then
              isolated+=("$file")
            else
              shared+=("$file")
            fi
          done
          echo "Service suites: ${#shared[@]} shared, ${#isolated[@]} isolated"
          if ((${#shared[@]})); then
            bun test "${shared[@]}"
          fi
          for file in "${isolated[@]}"; do
            bun test "$file"
          done

      - name: Run activity lifecycle regression suites in separate processes
        run: |
          cd apps/api
          bun test src/services/activity/__tests__/activity-queue.test.ts
          bun test src/services/activity/__tests__/activity-room-manager.test.ts

      - name: Run runtime suites in separate processes
        # mock.module and module caches are process-global. Isolate every runtime
        # file, including DoorDash action parsing and the owner reply contracts.
        shell: bash
        run: |
          mapfile -d '' files < <(find packages/agent-runtime/src -name '*.test.ts' -print0 | sort -z)
          test "${#files[@]}" -gt 0
          for file in "${files[@]}"; do
            bun test "./$file"
          done

      - name: Run hosted runtime probe safety tests
        run: bun test apps/api/scripts/agent-connect/hosted-skill-runtime-probe.test.ts

      - name: Run the protocol-pin route tests
        # 2026-09-15 — closes the stale-pin blind spot: agent-paid-surface.test.ts
        # sat pinned at PROTOCOL_VERSION 56 through the v57 AND v58 bumps because
        # routes/__tests__ never ran in CI and pin sweeps grepped for the old
        # number. These three files assert the live protocol version and the
        # served-manual/ack contracts; any future bump that misses them goes RED
        # here instead of rotting silently.
        #
        # SEPARATE bun process (not appended to the step above) on purpose: the
        # in-memory sim singletons carry state across test files in a shared
        # process (the documented pre-existing isolation bug), and these route
        # files boot different fixtures. The full routes/__tests__ dir stays out
        # of CI for now — it is NOT green without env/DB (FINGERPRINT_SECRET,
        # DATABASE_URL) and remains Phase 0b.
        run: cd apps/api && bun test src/routes/__tests__/agent-paid-surface.test.ts src/routes/__tests__/agent-session-ack.test.ts src/routes/__tests__/dashboard-skill-acks.test.ts

  # Phase 0b uses a separate job and Bun process to avoid cross-file singleton
  # pollution. The in-memory lane stays guaranteed-green and required; this lane
  # is required by both deploy callers before any live migration starts.
  # Use migrate-ci.ts, not db:push: drizzle-kit introspection is broken here.
  # All database credentials and env values below are dummy fixtures, not secrets.
  api-route-tests-db:
    name: api route tests (Postgres-backed)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: test
          POSTGRES_DB: clawville_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: Install workspace deps
        run: bun install --frozen-lockfile

      - name: Build the packages the money tests need
        # Build agent-runtime and its dependencies, plus wager-program.
        run: bunx turbo run build --filter=@clawville/agent-runtime --filter=@clawville/wager-program

      - name: Generate the full base schema from the Drizzle TS schema
        # The hand-authored migrations are forward-only on top of a base schema
        # that predates them — a fresh service DB needs this bootstrap first.
        # drizzle-kit generate is pure TS→SQL (no DB introspection; the known
        # introspection bug does not apply). Empty out dir ⇒ full schema.
        run: cd packages/database && rm -rf .drizzle-ci-bootstrap && bunx drizzle-kit generate --config drizzle.ci-bootstrap.config.ts --name base_schema

      - name: Apply the base schema to the empty service database
        # Guarded: the script refuses to run against any DB that already has
        # the app schema, so it can never touch staging/prod.
        env:
          MIGRATION_DATABASE_URL: postgres://postgres:test@localhost:5432/clawville_test
        run: bun packages/database/scripts/ci-bootstrap-schema.ts

      - name: Apply DB migrations to the service database
        env:
          MIGRATION_DATABASE_URL: postgres://postgres:test@localhost:5432/clawville_test
        run: bun packages/database/scripts/migrate-ci.ts

      - name: Restore declared CI constraints and assert staging invariant inventory
        # drizzle-kit 0.24 omits CHECKs; bootstrap CASCADE can remove retained FKs.
        # This refuses non-local databases and never participates in live migrations.
        env:
          MIGRATION_DATABASE_URL: postgres://postgres:test@localhost:5432/clawville_test
        run: |
          bun packages/database/scripts/ci-restore-schema-invariants.ts
          bun test packages/database/scripts/ci-schema-invariants.test.ts

      - name: Run PostgreSQL-backed Trading Floor database contracts
        env:
          DATABASE_URL: postgres://postgres:test@localhost:5432/clawville_test
          FINGERPRINT_SECRET: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
        run: cd apps/api && bun test src/services/__tests__/trading-migrations-db.test.ts src/services/__tests__/trade-observer.test.ts

      - name: Run the wager abort-recovery DB tests (real sweep, close and watch SQL)
        env:
          DATABASE_URL: postgres://postgres:test@localhost:5432/clawville_test
          FINGERPRINT_SECRET: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
        run: cd apps/api && bun test src/services/activity/__tests__/wager-lobby-bridge.db.test.ts

      - name: Seed the canonical land parcel grid
        # land DB-contract tests pick real parcels; idempotent 56-row seed,
        # explicit-URL-only (SEED_DATABASE_URL, dummy CI value — not a secret).
        env:
          SEED_DATABASE_URL: postgres://postgres:test@localhost:5432/clawville_test
        run: bun apps/api/scripts/seed-land-parcels.ts

      - name: Run route tests with automatic mock isolation
        # Every new mock.module file joins the isolated set without a filename
        # list update. Comments can only cause extra isolation, never shared mocks.
        shell: bash
        env:
          DATABASE_URL: postgres://postgres:test@localhost:5432/clawville_test
          FINGERPRINT_SECRET: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
        run: |
          cd apps/api
          shopt -s nullglob
          files=(src/routes/__tests__/*.test.ts)
          test "${#files[@]}" -gt 0
          shared=()
          isolated=()
          for file in "${files[@]}"; do
            if grep -qE 'mock[.]module' "$file"; then
              isolated+=("$file")
            else
              shared+=("$file")
            fi
          done
          echo "Route suites: ${#shared[@]} shared, ${#isolated[@]} isolated"
          if ((${#shared[@]})); then
            bun test "${shared[@]}"
          fi
          for file in "${isolated[@]}"; do
            bun test "$file"
          done
