name: Auto-deploy PROD on push to master

# Triggers Coolify deploys on the PROD box (Hillsboro, post-2026-05-23 migration)
# for both api (app 2) and web (app 3) on every push to `master`.
# Staging deploys are handled by .github/workflows/deploy-staging.yml.
#
# Push flow guardrail (see CLAUDE.md "PUSH FLOW"):
#   - New work goes to `staging` branch first → deploy-staging.yml fires →
#     verify on staging.clawville.world / api-staging.clawville.world.
#   - After verification, open a PR `staging → master` and merge to promote.
#     This workflow runs on the master merge and ships to prod.
#   - Override: a commit message containing the literal phrase "direct to master"
#     (case-insensitive) signals that staging was intentionally bypassed (hotfix
#     window only). Logged for audit.
#
# REQUIRED GITHUB REPO SECRETS (Settings → Secrets and variables → Actions):
#   PROD_VPS_IP        — the real IP from scripts/deploy/.env.deploy
#   COOLIFY_SSH_KEY    — contents of ~/.ssh/clawville_hillsboro (private key,
#                        the passphrase-free build; if your local key has a
#                        passphrase, export a copy without one for CI use)
# Until BOTH secrets exist, this workflow will fail and prod deploys must run
# manually via `ssh root@$PROD_VPS_IP 'bash /root/clawville-deploy.sh'`.
#
# clawville-deploy.sh lives on the VPS at /root/ and is the authoritative copy
# of scripts/deploy/clawville-deploy.sh in this repo. After editing the repo
# copy, scp it onto the box:
#   scp scripts/deploy/clawville-deploy.sh root@$PROD_VPS_IP:/root/ && \
#     ssh root@$PROD_VPS_IP 'chmod +x /root/clawville-deploy.sh'

on:
  push:
    branches:
      - master

concurrency:
  group: coolify-deploy-prod
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Flag direct-to-master deploys (audit log)
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
        run: |
          if echo "$COMMIT_MSG" | grep -iqE 'direct to master'; then
            echo "::warning::This commit explicitly bypassed staging (commit message contains 'direct to master')."
          fi

      - name: Trigger Coolify deploys via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.PROD_VPS_IP }}
          username: root
          key: ${{ secrets.COOLIFY_SSH_KEY }}
          port: 22
          script_stop: true
          command_timeout: 5m
          script: |
            set -eo pipefail
            echo "Triggering PROD Coolify deploys for commit ${{ github.sha }}"
            /root/clawville-deploy.sh
            echo "Both prod deploys queued."
