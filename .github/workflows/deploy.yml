name: Auto-deploy to Coolify

# Triggers a Coolify deploy for both the api (app 3) and web (app 4)
# on every push to master. Coolify's built-in webhook delivery is not
# configured for this repo (source_type/source_id are null on both apps;
# only "Public GitHub" placeholder exists in coolify). Instead of
# reconfiguring Coolify's GitHub App integration, this workflow SSHes
# into the VPS and invokes /root/clawville-deploy.sh, which runs the
# same `php artisan tinker` deploy command we'd run manually.
#
# The script lives ON the VPS to avoid YAML→bash→tinker quote escaping
# hell. Source of truth is in this repo at scripts/deploy/clawville-deploy.sh
# — copy any changes there to /root/ on the VPS via:
#   scp -i ~/.ssh/clawville_deploy scripts/deploy/clawville-deploy.sh \
#     root@<PROD_VPS_IP>:/root/ && \
#   ssh ... 'chmod +x /root/clawville-deploy.sh'

on:
  push:
    branches:
      - master

concurrency:
  group: coolify-deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Coolify deploys via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: <PROD_VPS_IP>
          username: root
          key: ${{ secrets.COOLIFY_SSH_KEY }}
          port: 22
          script_stop: true
          command_timeout: 5m
          script: |
            set -eo pipefail
            echo "Triggering Coolify deploys for commit ${{ github.sha }}"
            /root/clawville-deploy.sh
            echo "Both deploys queued."
