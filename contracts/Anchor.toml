[toolchain]
anchor_version = "0.31.1"
# solana_version intentionally unpinned — pinning here causes anchor build to
# `solana-install init <ver>`, which swaps in solana's bundled cargo. As of
# 2026-04, solana CLI 2.2.14's bundled cargo 1.84 cannot parse modern
# transitive deps that require edition2024 (e.g. toml_datetime 1.1.1+).
# Use the system Agave 3.x toolchain instead, which ships cargo ≥ 1.85.

[features]
resolution = true
skip-lint = false

[programs.localnet]
clawville_wager = "HgQhHVYV2C5Mw8K81kEnADkqsuS5YQRmGJDUR5wnZVuG"

[programs.devnet]
clawville_wager = "HgQhHVYV2C5Mw8K81kEnADkqsuS5YQRmGJDUR5wnZVuG"

[registry]
url = "https://api.apr.dev"

[provider]
cluster = "Localnet"
wallet = "~/.config/solana/id.json"

[scripts]
test = "bun run --bun ts-mocha -p ./tsconfig.json -t 1000000 tests/**/*.ts"

[test.validator]
url = "https://api.devnet.solana.com"

[[test.validator.clone]]
address = "TokenkegQfeZyiNwAJbNbGKPFXCWuBvf9Ss623VQ5DA"
