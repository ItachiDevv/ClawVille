  <line x1="128" y1="42" x2="115" y2="28" stroke="#ff00cc" stroke-width="3" opacity="0.7"/>
  <line x1="128" y1="42" x2="141" y2="28" stroke="#ff00cc" stroke-width="3" opacity="0.7"/>
