  <!-- Right crystal -->
  <polygon points="166,70 178,112 177,158 168,168 158,158 154,112" fill="url(#xtal10b)" stroke="#00ffe0" stroke-width="5" stroke-linejoin="round"/>
  <line x1="166" y1="70" x2="168" y2="168" stroke="white" stroke-width="1.5" opacity="0.35"/>
  <!-- Far left small crystal -->
  <polygon points="58,105 66,130 64,158 56,165 48,158 46,130" fill="url(#xtal10a)" stroke="#00ffe0" stroke-width="4" stroke-linejoin="round" opacity="0.85"/>
