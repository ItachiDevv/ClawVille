<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <radialGradient id="glow10" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00ffe0" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#00ffe0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="xtal10a" x1="0%" y1="0%" x2="60%" y2="100%">
