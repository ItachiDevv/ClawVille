<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bScg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe28a"/>
      <stop offset="0.5" stop-color="#ffc857"/>
      <stop offset="1" stop-color="#7a5208"/>
    </linearGradient>
    <linearGradient id="bSc2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff39a"/>
      <stop offset="0.55" stop-color="#e8a91c"/>
      <stop offset="1" stop-color="#5a3604"/>
    </linearGradient>
    <radialGradient id="bSb" cx="40%" cy="35%" r="65%">
      <stop offset="0" stop-color="#3a8acf"/>
      <stop offset="0.55" stop-color="#1a3a52"/>
      <stop offset="1" stop-color="#06223a"/>
    </radialGradient>
    <radialGradient id="hlSc" cx="32%" cy="22%" r="55%">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <ellipse cx="128" cy="228" rx="92" ry="10" fill="#0a1428" opacity="0.55"/>
  <!-- 8 starfish-arm rays alternating long/short -->
  <g fill="url(#bSc2)" stroke="#0a1428" stroke-width="5" stroke-linejoin="round">
    <!-- 4 main long arms (N S E W) -->
    <polygon points="128,16 116,98 140,98"/>
    <polygon points="240,128 158,116 158,140"/>
    <polygon points="128,240 116,158 140,158"/>
    <polygon points="16,128 98,116 98,140"/>
  </g>
  <g fill="url(#bScg)" stroke="#0a1428" stroke-width="4" stroke-linejoin="round">
    <!-- 4 diagonal shorter arms (NE SE SW NW) -->
    <polygon points="200,56 138,104 152,118"/>
    <polygon points="200,200 138,152 152,138"/>
    <polygon points="56,200 118,152 104,138"/>
    <polygon points="56,56 118,104 104,118"/>
  </g>
  <!-- outer gold ring -->
  <circle cx="128" cy="128" r="56" fill="url(#bScg)" stroke="#0a1428" stroke-width="6"/>
  <circle cx="128" cy="128" r="56" fill="none" stroke="#7a5208" stroke-width="3" opacity="0.7" transform="translate(0,2)"/>
  <!-- deep-blue inner circle -->
  <circle cx="128" cy="128" r="40" fill="url(#bSb)" stroke="#0a1428" stroke-width="5"/>
  <!-- N marker on inner ring -->
  <polygon points="128,90 122,108 134,108" fill="url(#bSc2)" stroke="#0a1428" stroke-width="2.5"/>
  <!-- center star -->
  <polygon points="128,108 134,124 150,124 138,134 142,150 128,140 114,150 118,134 106,124 122,124"
           fill="url(#bSc2)" stroke="#0a1428" stroke-width="2.5" stroke-linejoin="round"/>
  <!-- center dot -->
  <circle cx="128" cy="131" r="4" fill="#0a1428"/>
  <!-- pebble dots on long arms -->
  <g fill="#ffffff" opacity="0.7">
    <circle cx="128" cy="60" r="2.5"/>
    <circle cx="128" cy="196" r="2.5"/>
    <circle cx="60" cy="128" r="2.5"/>
    <circle cx="196" cy="128" r="2.5"/>
  </g>
  <!-- highlight on inner blue circle -->
  <circle cx="128" cy="128" r="40" fill="url(#hlSc)"/>
  <ellipse cx="112" cy="112" rx="11" ry="6" fill="#ffffff" opacity="0.55" transform="rotate(-30 112 112)"/>
</svg>
