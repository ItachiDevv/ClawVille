  <path d="M70 200 L186 200" stroke="#0a1428" stroke-width="4"/>
  <path d="M70 200 L186 200" stroke="#c4900c" stroke-width="2" transform="translate(0,-2)"/>
  <g fill="#0a1428">
    <circle cx="80" cy="200" r="2.5"/>
    <circle cx="100" cy="200" r="2.5"/>
    <circle cx="120" cy="200" r="2.5"/>
    <circle cx="140" cy="200" r="2.5"/>
    <circle cx="160" cy="200" r="2.5"/>
    <circle cx="180" cy="200" r="2.5"/>
  </g>
