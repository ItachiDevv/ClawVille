<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <!-- Plaque top half: deepest red (tier 3 / top-tier distinction) -->
    <linearGradient id="b9r" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff4858"/>
      <stop offset="0.5" stop-color="#a01828"/>
      <stop offset="1" stop-color="#3a0810"/>
    </linearGradient>
    <linearGradient id="b9g" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe28a"/>
      <stop offset="0.5" stop-color="#ffc857"/>
      <stop offset="1" stop-color="#9a6a08"/>
    </linearGradient>
    <radialGradient id="b9riv" cx="50%" cy="35%" r="60%">
      <stop offset="0" stop-color="#fff3c0"/>
      <stop offset="0.6" stop-color="#ffc857"/>
      <stop offset="1" stop-color="#6a4408"/>
    </radialGradient>
    <radialGradient id="hl9" cx="35%" cy="22%" r="55%">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="b9letter" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff7d8"/>
      <stop offset="1" stop-color="#f0c860"/>
    </linearGradient>

    <!-- Reusable plaque (native: x=22..234, y=56..188; center 128,122)
         Letters here are taller-than-stock to survive 0.62 scale-down (legibility). -->
    <g id="bar3plaque">
      <rect x="22" y="56" width="212" height="132" rx="20"
            fill="url(#b9g)" stroke="#0a1428" stroke-width="6" stroke-linejoin="round"
            transform="translate(4,4)" opacity="0.55"/>
      <rect x="22" y="56" width="212" height="132" rx="20"
            fill="url(#b9r)" stroke="#0a1428" stroke-width="6" stroke-linejoin="round"/>
      <path d="M22 124 L234 124 L234 168 Q234 188 214 188 L42 188 Q22 188 22 168 Z"
            fill="url(#b9g)" stroke="#0a1428" stroke-width="6" stroke-linejoin="round"/>
      <rect x="34" y="68" width="188" height="108" rx="14"
            fill="none" stroke="url(#b9g)" stroke-width="3" opacity="0.95"/>
      <rect x="34" y="68" width="188" height="108" rx="14"
            fill="none" stroke="#5a3a08" stroke-width="1.2" opacity="0.8"/>
      <g stroke="#0a1428" stroke-width="2">
        <circle cx="44"  cy="78"  r="6" fill="url(#b9riv)"/>
        <circle cx="212" cy="78"  r="6" fill="url(#b9riv)"/>
        <circle cx="44"  cy="166" r="6" fill="url(#b9riv)"/>
        <circle cx="212" cy="166" r="6" fill="url(#b9riv)"/>
      </g>
      <!-- BAR text — same chunky path-traced letters from s5 (occupies y=84..160, h=76 within plaque h=132 → ~58% of plaque height; chunky enough to survive 0.62 scale to ~47px tall at 256 frame; remains legible) -->
      <g fill="url(#b9letter)" stroke="#0a1428" stroke-width="5"
         stroke-linejoin="round" stroke-linecap="round" transform="translate(-14,0)">
        <path d="M56 84 L92 84 Q108 84 108 100 Q108 114 96 118 Q112 122 112 138 Q112 160 92 160 L56 160 Z
                 M72 96 L88 96 Q96 96 96 104 Q96 112 88 112 L72 112 Z
                 M72 124 L90 124 Q98 124 98 134 Q98 148 88 148 L72 148 Z"
              fill-rule="evenodd"/>
        <path d="M116 160 L134 84 L156 84 L174 160 L158 160 L154 144 L136 144 L132 160 Z
                 M139 132 L151 132 L145 108 Z"
              fill-rule="evenodd"/>
        <path d="M180 160 L180 84 L210 84 Q228 84 228 102 Q228 116 216 122 L230 160 L214 160 L204 128 L196 128 L196 160 Z
                 M196 96 L208 96 Q216 96 216 104 Q216 116 208 116 L196 116 Z"
              fill-rule="evenodd"/>
      </g>
      <rect x="22" y="56" width="212" height="132" rx="20" fill="url(#hl9)"/>
      <ellipse cx="62" cy="74" rx="22" ry="6" fill="#ffffff" opacity="0.45"/>
    </g>
  </defs>

  <!-- ground shadow at bottom -->
  <ellipse cx="128" cy="246" rx="84" ry="7" fill="#0a1428" opacity="0.55"/>

  <!-- Three plaques stacked, scale 0.62. Native plaque h=132 → scaled 81.84.
       Stack of 3 with no gap = 245.5 — fits in 256 frame with ~5px margins each side.
       Plaque centers at y: 50, 132, 214 (stack centered at y=132). -->
  <!-- TOP plaque: final center (128, 50) → translate = (128 - 79.36, 50 - 75.64) = (48.64, -25.64) -->
  <g transform="translate(48.64,-25.64) scale(0.62)">
    <use href="#bar3plaque"/>
  </g>

  <!-- MIDDLE plaque: final center (128, 132) → translate = (48.64, 56.36) -->
  <g transform="translate(48.64,56.36) scale(0.62)">
    <use href="#bar3plaque"/>
  </g>

  <!-- BOTTOM plaque: final center (128, 214) → translate = (48.64, 138.36) -->
  <g transform="translate(48.64,138.36) scale(0.62)">
    <use href="#bar3plaque"/>
  </g>
</svg>
