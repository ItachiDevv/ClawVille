<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <radialGradient id="b2y" cx="40%" cy="30%" r="75%">
      <stop offset="0" stop-color="#fff39a"/>
      <stop offset="0.5" stop-color="#f5c727"/>
      <stop offset="1" stop-color="#7a5208"/>
    </radialGradient>
    <radialGradient id="hl2" cx="35%" cy="25%" r="55%">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <ellipse cx="128" cy="228" rx="70" ry="10" fill="#0a1428" opacity="0.5"/>
  <!-- 5-arm starfish: chunky star using cubic curves between arm tips -->
  <path d="M128 30
           C140 80 148 92 196 92
           C156 116 150 130 168 188
           C128 156 116 156 88 188
           C100 132 96 116 56 92
           C108 92 116 80 128 30 Z"
        fill="url(#b2y)" stroke="#0a1428" stroke-width="6" stroke-linejoin="round"/>
  <!-- inner stroke ridge -->
  <path d="M128 56
           C138 96 144 104 178 104
           C150 124 146 134 158 174
           C128 150 120 150 98 174
           C108 130 104 124 78 104
           C112 104 118 96 128 56 Z"
        fill="none" stroke="#c4900c" stroke-width="2.5" stroke-linejoin="round" opacity="0.8"/>
  <!-- highlight overlay (below dots so dots stay visible) -->
  <path d="M128 30
           C140 80 148 92 196 92
           C156 116 150 130 168 188
           C128 156 116 156 88 188
           C100 132 96 116 56 92
           C108 92 116 80 128 30 Z"
        fill="url(#hl2)"/>
  <!-- pebble dots (on top) -->
  <g fill="#ffffff" stroke="#a06808" stroke-width="1.2" opacity="0.95">
    <circle cx="124" cy="78" r="5"/>
    <circle cx="142" cy="100" r="4.5"/>
    <circle cx="108" cy="100" r="4"/>
    <circle cx="156" cy="130" r="5"/>
    <circle cx="100" cy="134" r="4.5"/>
    <circle cx="128" cy="124" r="4"/>
    <circle cx="138" cy="160" r="4"/>
    <circle cx="116" cy="162" r="4"/>
  </g>
</svg>
