      <stop offset="0%" stop-color="#ffc857" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#ffc857" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="coin4" cx="38%" cy="32%" r="65%">
      <stop offset="0%" stop-color="#ffe599"/>
