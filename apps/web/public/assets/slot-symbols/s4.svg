  <line x1="128" y1="130" x2="128" y2="162" stroke="#00ffe0" stroke-width="5" stroke-linecap="round"/>
  <line x1="140" y1="130" x2="148" y2="160" stroke="#00ffe0" stroke-width="5" stroke-linecap="round"/>
  <!-- Shine -->
