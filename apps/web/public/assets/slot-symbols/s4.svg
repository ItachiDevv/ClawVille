  <circle cx="128" cy="128" r="76" fill="url(#coin4)" stroke="#ffc857" stroke-width="6"/>
  <!-- Coin rim detail -->
  <circle cx="128" cy="128" r="65" fill="none" stroke="#ffaa00" stroke-width="3" opacity="0.6"/>
