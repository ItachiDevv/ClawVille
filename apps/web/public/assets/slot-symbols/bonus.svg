<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bBwood" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a06432"/>
      <stop offset="0.5" stop-color="#6a3a16"/>
      <stop offset="1" stop-color="#2a1408"/>
    </linearGradient>
    <linearGradient id="bBwood2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b97844"/>
      <stop offset="0.5" stop-color="#7a4a1c"/>
      <stop offset="1" stop-color="#3a200a"/>
    </linearGradient>
    <linearGradient id="bBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff39a"/>
      <stop offset="0.5" stop-color="#ffc857"/>
      <stop offset="1" stop-color="#7a5208"/>
    </linearGradient>
    <radialGradient id="bBcoin" cx="38%" cy="30%" r="65%">
      <stop offset="0" stop-color="#fff39a"/>
      <stop offset="0.5" stop-color="#ffc857"/>
      <stop offset="1" stop-color="#7a5208"/>
    </radialGradient>
    <radialGradient id="hlB" cx="32%" cy="22%" r="55%">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <ellipse cx="128" cy="232" rx="100" ry="10" fill="#0a1428" opacity="0.55"/>
  <!-- chest body (bottom box) -->
  <path d="M40 130 L216 130 L216 216 Q216 224 208 224 L48 224 Q40 224 40 216 Z"
        fill="url(#bBwood)" stroke="#0a1428" stroke-width="6" stroke-linejoin="round"/>
  <!-- wood planks (vertical) -->
  <g fill="none" stroke="#0a1428" stroke-width="2.5" opacity="0.55">
    <line x1="84" y1="134" x2="84" y2="222"/>
    <line x1="128" y1="134" x2="128" y2="222"/>
    <line x1="172" y1="134" x2="172" y2="222"/>
  </g>
  <!-- gold horizontal straps -->
  <rect x="40" y="142" width="176" height="10" fill="url(#bBg)" stroke="#0a1428" stroke-width="3"/>
  <rect x="40" y="200" width="176" height="10" fill="url(#bBg)" stroke="#0a1428" stroke-width="3"/>
  <!-- gold corner reinforcements -->
  <g fill="url(#bBg)" stroke="#0a1428" stroke-width="3">
    <rect x="40" y="130" width="22" height="22"/>
    <rect x="194" y="130" width="22" height="22"/>
    <rect x="40" y="202" width="22" height="22"/>
    <rect x="194" y="202" width="22" height="22"/>
  </g>
  <!-- rivets on straps -->
  <g fill="#0a1428">
    <circle cx="74" cy="147" r="2"/>
    <circle cx="128" cy="147" r="2"/>
    <circle cx="182" cy="147" r="2"/>
    <circle cx="74" cy="205" r="2"/>
    <circle cx="128" cy="205" r="2"/>
    <circle cx="182" cy="205" r="2"/>
  </g>
  <!-- front lock plate -->
  <path d="M114 172 L142 172 L138 196 L118 196 Z"
        fill="url(#bBg)" stroke="#0a1428" stroke-width="3" stroke-linejoin="round"/>
  <circle cx="128" cy="182" r="4" fill="#0a1428"/>
  <!-- lid (open, tilted back-up) -->
  <path d="M30 130 L226 130 L210 90 Q200 70 128 64 Q56 70 46 90 Z"
        fill="url(#bBwood2)" stroke="#0a1428" stroke-width="6" stroke-linejoin="round"/>
  <!-- gold band on lid edge -->
  <path d="M30 130 L226 130" stroke="url(#bBg)" stroke-width="8"/>
  <path d="M30 130 L226 130" stroke="#0a1428" stroke-width="3"/>
  <!-- lid wood grain -->
  <g fill="none" stroke="#0a1428" stroke-width="2" opacity="0.5">
    <path d="M70 124 Q72 100 80 80"/>
    <path d="M128 122 Q128 96 128 70"/>
    <path d="M186 124 Q184 100 176 80"/>
  </g>
  <!-- inside dark cavity (peek between lid + body) -->
  <path d="M58 130 L198 130 L188 144 L68 144 Z" fill="#0a1428"/>
  <!-- coins spilling -->
  <g stroke="#0a1428" stroke-width="3">
    <ellipse cx="92" cy="122" rx="14" ry="6" fill="url(#bBcoin)" transform="rotate(-15 92 122)"/>
    <ellipse cx="128" cy="116" rx="15" ry="7" fill="url(#bBcoin)"/>
    <ellipse cx="166" cy="124" rx="14" ry="6" fill="url(#bBcoin)" transform="rotate(15 166 124)"/>
    <circle cx="104" cy="104" r="9" fill="url(#bBcoin)"/>
    <circle cx="148" cy="100" r="10" fill="url(#bBcoin)"/>
    <circle cx="180" cy="108" r="7" fill="url(#bBcoin)"/>
  </g>
  <!-- $ on biggest coin -->
  <text x="148" y="106" text-anchor="middle" font-family="Arial,sans-serif" font-size="14" font-weight="bold" fill="#7a5208">$</text>
  <!-- sparkles -->
  <g fill="#ffe28a" stroke="#0a1428" stroke-width="1.5">
    <polygon points="60,52 64,62 74,66 64,70 60,80 56,70 46,66 56,62"/>
    <polygon points="200,40 204,50 214,54 204,58 200,68 196,58 186,54 196,50"/>
    <polygon points="130,28 134,38 144,42 134,46 130,56 126,46 116,42 126,38"/>
  </g>
  <!-- highlight on body -->
  <path d="M40 130 L216 130 L216 216 Q216 224 208 224 L48 224 Q40 224 40 216 Z" fill="url(#hlB)"/>
  <!-- spec on lid -->
  <ellipse cx="80" cy="100" rx="20" ry="6" fill="#ffffff" opacity="0.35" transform="rotate(-15 80 100)"/>
</svg>
