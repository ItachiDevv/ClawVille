    <path d="M198 214 Q210 200 208 178 Q198 168 184 178 Q188 192 196 198 Q184 196 176 184 Q170 198 184 210 Q198 222 198 214 Z"/>
    <path d="M128 234 Q148 224 156 204 Q158 186 140 180 Q132 192 132 206 Q126 196 128 180 Q114 184 112 204 Q116 224 128 234 Z"/>
    <path d="M42 186 Q58 200 82 196 Q96 186 84 170 Q68 176 60 186 Q66 172 78 166 Q64 160 48 174 Q36 186 42 186 Z"/>
    <path d="M24 114 Q32 132 56 132 Q68 126 64 106 Q48 104 36 114 Q40 98 56 94 Q36 88 26 104 Q20 114 24 114 Z"/>
    <path d="M58 42 Q46 56 48 78 Q58 88 72 78 Q68 64 60 58 Q72 60 80 72 Q86 58 72 46 Q58 34 58 42 Z"/>
